# ATENCAO: arquivo gerado/injetado automaticamente nos espelhos publicos
# pelo callable-mirror-release. Roda NO REPO PUBLICO (que pode usar secrets
# de org no plano Free) e notifica o Discord quando uma release e publicada.
# Nao editar aqui: e sobrescrito a cada release pelo mirror.
name: Release Notify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag da release (ex: v1.2.3)"
        required: true

jobs:
  discord:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Libera o GITHUB_TOKEN a usar o GitHub Models (resumo por IA), sem PAT.
      models: read
      # OIDC: emite o JWT que o Infisical troca pela config de IA.
      id-token: write
    steps:
      # Config do resumo por IA (AI_PROVIDER/AI_MODEL/AI_BASE_URL/AI_API_KEY)
      # vinda do Infisical, exportada como env. Nao-fatal: se falhar, o passo
      # seguinte cai nas vars/secrets do repo e, na ausencia delas, nas notas
      # cruas — a release ja esta publicada de qualquer forma.
      #
      # ATENCAO: este workflow roda no ESPELHO PUBLICO, nao e um callable do
      # repo `workflows`. O job_workflow_ref do JWT aponta para o espelho, entao
      # a identity do Infisical precisa aceitar esses repos — uma trust
      # condition amarrada so nos callables nao cobre este caso.
      - name: Config de IA via Infisical (OIDC)
        id: infisical
        if: ${{ !contains(fromJSON('["false","0","off","no"]'), format('{0}', vars.CI_SECRETS_INFISICAL)) }}
        continue-on-error: true
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          domain: https://secrets.mriqbox.com.br
          identity-id: efec2ffe-55d0-479d-9535-8da6b0ea4665
          project-slug: github-releases-k1-qq
          env-slug: prod
          oidc-audience: https://github.com/mri-Qbox-Brasil

      # O notificador e FONTE UNICA em mri-Qbox-Brasil/workflows
      # (.release/discord-release.js). Aqui ele e baixado em vez de instalado
      # via npm porque este job roda no espelho publico, que nao tem token do
      # registry privado da org — e o repo `workflows` e publico, entao o raw
      # responde sem autenticacao nenhuma.
      #
      # Segue `main` de proposito: correcao no notificador vale para todos os
      # espelhos sem precisar re-liberar cada um. Se o download falhar, o job
      # apenas nao notifica — a release ja esta publicada de qualquer forma.
      - name: Baixa o notificador de release
        id: fetch
        run: |
          mkdir -p .release
          if curl -fsSL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/mri-Qbox-Brasil/workflows/main/.release/discord-release.js \
            -o .release/discord-release.js; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::nao baixou o notificador; pulando a notificacao."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notifica Discord
        if: steps.fetch.outputs.ok == 'true'
        run: node .release/discord-release.js "${{ github.event.inputs.version || github.event.release.tag_name }}"
        env:
          NOTIFY_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN || github.token }}
          # Provedor do resumo por IA: groq | gemini | github | custom.
          # Vazio => github, que no plano free da org responde 403 e cai nas
          # notas cruas. Ver a secao "Resumo por IA" no README.
          #
          # Padrao `env.X || vars.X`: usa o valor vindo do Infisical (exportado
          # como env pelo passo acima) e so cai na var/secret do repo se ele
          # nao veio. Escrever so `vars.X` aqui SOBRESCREVERIA com string vazia
          # o que o Infisical exportou — mesmo bug que ja mordeu o GH_TOKEN no
          # mirror-release.
          AI_PROVIDER: ${{ env.AI_PROVIDER || vars.AI_PROVIDER }}
          AI_MODEL: ${{ env.AI_MODEL || vars.AI_MODEL }}
          AI_BASE_URL: ${{ env.AI_BASE_URL || vars.AI_BASE_URL }}
          AI_API_KEY: ${{ env.AI_API_KEY || secrets.AI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # Chave atual (CI_RELEASE_NOTIFY_DISCORD) ou a var legada.
          DISCORD_RELEASE_NOTIFY: ${{ vars.CI_RELEASE_NOTIFY_DISCORD || vars.DISCORD_RELEASE_NOTIFY }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.UPDATE_DISCORD_WEBHOOK }}
          LOGO_MRIQBOX_URL: ${{ secrets.LOGO_MRIQBOX_URL }}
          RESOURCE_MRIQBOX_URL: ${{ secrets.RESOURCE_MRIQBOX_URL }}
          INVITE_DISCORD_URL: ${{ secrets.INVITE_DISCORD_URL }}
          DOCS_MRIQBOX_URL: ${{ secrets.DOCS_MRIQBOX_URL }}

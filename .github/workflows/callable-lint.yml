name: Callable — Lint

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '20'
      pnpm-version:
        type: string
        default: '9'
      web-dir:
        type: string
        default: 'web'
      web-lint:
        description: 'Habilita ESLint (desabilitar em repos Lua-only)'
        type: boolean
        default: true
      lua-lint:
        description: 'Habilita luacheck (requer .luacheckrc no repo)'
        type: boolean
        default: false

jobs:
  # As chaves `CI_LINT_*` aqui sao TRI-STATE, nao so liga-desliga:
  #
  #   vazia  -> quem decide e o input do wrapper (o default que veio do template)
  #   true   -> liga, mesmo com o input false
  #   false  -> desliga, mesmo com o input true
  #
  # O "true" existe porque o template-sync SOBRESCREVE o wrapper: um repo que
  # editasse `lua-lint: true` no proprio lint.yml perderia isso no primeiro PR de
  # sync (o pull param default resolve conflito a favor do template, `-X theirs`)
  # e o luacheck pararia de rodar em silencio. A var mora fora do arquivo, entao
  # sobrevive. Ver a secao "Chaves liga-desliga" no README.
  lint-web:
    name: Lint Web (ESLint)
    if: ${{ contains(fromJSON('["true","1","on","yes"]'), format('{0}', vars.CI_LINT_WEB)) || (inputs.web-lint && !contains(fromJSON('["false","0","off","no"]'), format('{0}', vars.CI_LINT_WEB))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
          cache-dependency-path: ${{ inputs.web-dir }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ inputs.web-dir }}
        run: pnpm install --no-frozen-lockfile

      - name: Run ESLint
        working-directory: ${{ inputs.web-dir }}
        run: pnpm run lint

  lint-lua:
    name: Lint Lua (luacheck)
    if: ${{ contains(fromJSON('["true","1","on","yes"]'), format('{0}', vars.CI_LINT_LUA)) || (inputs.lua-lint && !contains(fromJSON('["false","0","off","no"]'), format('{0}', vars.CI_LINT_LUA))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install luacheck
        # O pacote Debian/Ubuntu chama-se `lua-check`; o binario e que e `luacheck`.
        # `apt-get install luacheck` falha com "Unable to locate package".
        run: sudo apt-get update && sudo apt-get install -y lua-check

      - name: Run luacheck
        run: luacheck .

name: Callable — Update Actions Versions

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '20'
      pr-team:
        type: string
        default: ''
      # Ref usada no fallback por raw (ver o passo do curl mais abaixo).
      script-ref:
        type: string
        default: 'main'
      # Config do Infisical (fonte central de secrets via OIDC). Nada aqui e
      # secret: o Identity ID e so um identificador — a auth exige o JWT OIDC do
      # Actions casar com a trust condition (repository_owner) da identity.
      infisical-domain:
        type: string
        default: 'https://secrets.mriqbox.com.br'
      infisical-identity:
        type: string
        default: 'efec2ffe-55d0-479d-9535-8da6b0ea4665'
      infisical-project:
        type: string
        default: 'github-releases-k1-qq'
      infisical-env:
        type: string
        default: 'prod'
      infisical-audience:
        type: string
        default: 'https://github.com/mri-Qbox-Brasil'
    secrets:
      # Agora opcional: com o Infisical vem por OIDC. Aceito como fallback.
      GH_TOKEN:
        required: false
      # Fallback só para ler o pacote privado @mri-qbox-brasil/workflows a partir
      # de outra org (ex.: MRI-Bot), onde o OIDC do Infisical não vale e o
      # `github.token` do repo chamador não enxerga o registry de lá.
      PACKAGES_TOKEN:
        required: false

jobs:
  update-actions:
    # Chave do job: `vars.CI_UPDATE_ACTIONS=false` congela as versoes das actions
    # neste repo. Ver a secao "Chaves liga-desliga" no README.
    if: ${{ !contains(fromJSON('["false","0","off","no"]'), format('{0}', vars.CI_UPDATE_ACTIONS)) }}
    runs-on: ubuntu-latest
    # ATENCAO — o wrapper chamador precisa declarar ESTE MESMO bloco, inteiro.
    # Declarar `permissions:` num job SUBSTITUI as permissoes padrao, nao soma:
    # todo escopo omitido vira `none`, e um reusable workflow que peca mais do que
    # o chamador concede morre em startup_failure, sem job e sem log. O id-token
    # (OIDC do Infisical) so e concedido aqui se o chamador tambem conceder.
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Chaves (vars) deste repositorio
        env:
          CI_SECRETS_INFISICAL: ${{ vars.CI_SECRETS_INFISICAL }}
        run: |
          echo "CI_UPDATE_ACTIONS=<ligado: o job rodou>"
          echo "CI_SECRETS_INFISICAL=${CI_SECRETS_INFISICAL:-<vazio: ligado>}"

      # Puxa os secrets do Infisical via OIDC (fonte central). Nao-fatal: cai no
      # fallback secrets.* se o Infisical estiver fora.
      #
      # Chave: `vars.CI_SECRETS_INFISICAL=false` pula o Infisical e usa so os
      # secrets nativos do repo/org.
      - name: Secrets via Infisical (OIDC)
        id: infisical
        if: ${{ !contains(fromJSON('["false","0","off","no"]'), format('{0}', vars.CI_SECRETS_INFISICAL)) }}
        continue-on-error: true
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          domain: ${{ inputs.infisical-domain }}
          identity-id: ${{ inputs.infisical-identity }}
          project-slug: ${{ inputs.infisical-project }}
          env-slug: ${{ inputs.infisical-env }}
          oidc-audience: ${{ inputs.infisical-audience }}

      # Este job so funciona com PAT, e nao ha como contornar: o push toca
      # `.github/workflows/`, e o GITHUB_TOKEN padrao e um GitHub App — o GitHub
      # recusa com "refusing to allow a GitHub App to create or update workflow
      # ... without `workflows` permission", e `workflows` nao existe como escopo
      # declaravel em `permissions:`. Sem esse preflight a run ia ate o fim e
      # morria no push, com o erro escondido no meio do log.
      - name: Preflight — token capaz de escrever em .github/workflows/
        env:
          RESOLVED_TOKEN: ${{ env.GH_TOKEN || secrets.GH_TOKEN }}
        run: |
          if [ -z "$RESOLVED_TOKEN" ]; then
            echo "::error::Sem GH_TOKEN (nem pelo Infisical, nem por secret do repo/org). Este job precisa de um PAT com escopo 'workflow' no secret GH_TOKEN — o GITHUB_TOKEN padrao nao pode alterar arquivos de workflow."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ env.GH_TOKEN || secrets.GH_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mri-qbox-brasil'

      - name: Install workflows
        id: install
        continue-on-error: true
        run: npm install --no-save @mri-qbox-brasil/workflows
        env:
          NODE_AUTH_TOKEN: ${{ env.GH_TOKEN || secrets.GH_TOKEN || secrets.PACKAGES_TOKEN || github.token }}
          # Repo com `.npmrc` proprio (ex.: mri_botcreator) vence o user-level que
          # o setup-node escreve, e o de la referencia ${PACKAGES_TOKEN}. Sem esta
          # linha o token resolvia vazio e o install caia em 401 mesmo com o PAT
          # certo em maos.
          PACKAGES_TOKEN: ${{ env.GH_TOKEN || secrets.GH_TOKEN || secrets.PACKAGES_TOKEN }}

      # De fora da org o registry privado responde 401 e nao ha token que resolva
      # sem provisionar um PAT em cada org. Este repo e publico e o script nao tem
      # dependencia nenhuma, entao baixamos direto — mesmo padrao que o
      # callable-release-notify ja usa para os repos espelho.
      - name: Fallback — script direto do repo publico
        if: steps.install.outcome == 'failure'
        run: |
          echo "⚠️ npm install falhou (registry privado inacessivel); baixando o script por raw."
          curl -fsSL "https://raw.githubusercontent.com/mri-Qbox-Brasil/workflows/${{ inputs.script-ref }}/.release/update-actions.sh" \
            -o "$RUNNER_TEMP/update-actions.sh"

      - name: Run update
        run: |
          if [ -f "$RUNNER_TEMP/update-actions.sh" ]; then
            bash "$RUNNER_TEMP/update-actions.sh"
          else
            npx workflows update-actions
          fi
        env:
          GITHUB_TOKEN: ${{ env.GH_TOKEN || secrets.GH_TOKEN }}
          PR_TEAM: ${{ inputs.pr-team }}

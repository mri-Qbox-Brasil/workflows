name: Callable — Template Sync

on:
  workflow_call:
    inputs:
      source-repo:
        type: string
        default: 'mri-Qbox-Brasil/script-template'
      source-branch:
        type: string
        default: 'main'
      destination-branch:
        type: string
        default: 'main'
      paths:
        description: 'Pastas/arquivos de infraestrutura sincronizados do template (separados por espaço)'
        type: string
        default: '.github .release'
      force-deletion:
        description: 'Apaga, dentro de paths, o que não existe mais no template (o .templatesyncignore continua protegendo)'
        type: boolean
        default: false
      # Config do Infisical (fonte central de secrets via OIDC). Nada aqui e
      # secret: o Identity ID e so um identificador — a auth exige o JWT OIDC do
      # Actions casar com a trust condition (repository_owner) da identity.
      infisical-domain:
        type: string
        default: 'https://secrets.mriqbox.com.br'
      infisical-identity:
        type: string
        default: 'efec2ffe-55d0-479d-9535-8da6b0ea4665'
      infisical-project:
        type: string
        default: 'github-releases-k1-qq'
      infisical-env:
        type: string
        default: 'prod'
      infisical-audience:
        type: string
        default: 'https://github.com/mri-Qbox-Brasil'
    secrets:
      # PAT com escopo `workflow` (classic) ou fine-grained com
      # "Workflows: Read and write". O GITHUB_TOKEN padrão NÃO serve: o GitHub
      # proíbe App tokens de criar/alterar arquivos em .github/workflows/.
      GH_TOKEN:
        required: false

jobs:
  sync:
    # Chave do job: `vars.CI_TEMPLATE_SYNC=false` congela o template neste repo.
    # Ver a secao "Chaves liga-desliga" no README.
    if: ${{ !contains(fromJSON('["false","0","off","no"]'), format('{0}', vars.CI_TEMPLATE_SYNC)) }}
    runs-on: ubuntu-latest
    # ATENCAO — o wrapper chamador precisa declarar ESTE MESMO bloco, inteiro.
    # Declarar `permissions:` num job SUBSTITUI as permissoes padrao, nao soma:
    # todo escopo omitido vira `none`, e um reusable workflow que peca mais do que
    # o chamador concede morre em startup_failure, sem job e sem log. O id-token
    # (OIDC do Infisical) so e concedido aqui se o chamador tambem conceder.
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Chaves (vars) deste repositorio
        env:
          CI_SECRETS_INFISICAL: ${{ vars.CI_SECRETS_INFISICAL }}
        run: |
          echo "CI_TEMPLATE_SYNC=<ligado: o job rodou>"
          echo "CI_SECRETS_INFISICAL=${CI_SECRETS_INFISICAL:-<vazio: ligado>}"

      # Puxa os secrets do Infisical via OIDC (fonte central). Nao-fatal: cai no
      # fallback secrets.* se o Infisical estiver fora.
      #
      # Chave: `vars.CI_SECRETS_INFISICAL=false` pula o Infisical e usa so os
      # secrets nativos do repo/org.
      - name: Secrets via Infisical (OIDC)
        id: infisical
        if: ${{ !contains(fromJSON('["false","0","off","no"]'), format('{0}', vars.CI_SECRETS_INFISICAL)) }}
        continue-on-error: true
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          domain: ${{ inputs.infisical-domain }}
          identity-id: ${{ inputs.infisical-identity }}
          project-slug: ${{ inputs.infisical-project }}
          env-slug: ${{ inputs.infisical-env }}
          oidc-audience: ${{ inputs.infisical-audience }}

      - name: Token do sync
        id: token
        env:
          FALLBACK_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          token="${GH_TOKEN:-$FALLBACK_TOKEN}"
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.destination-branch }}
          token: ${{ steps.token.outputs.value }}

      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source-repo }}
          ref: ${{ inputs.source-branch }}
          token: ${{ steps.token.outputs.value }}
          path: .template-source

      - name: Copia a infraestrutura do template
        id: copy
        env:
          SYNC_PATHS: ${{ inputs.paths }}
          FORCE_DELETION: ${{ inputs.force-deletion }}
        run: |
          set -euo pipefail
          src=.template-source
          delete=()
          [ "$FORCE_DELETION" = "true" ] && delete=(--delete)

          read -ra paths <<< "$SYNC_PATHS"
          for p in "${paths[@]}"; do
            if [ -d "$src/$p" ]; then
              mkdir -p "$p"
              rsync -a "${delete[@]}" --exclude=.git "$src/$p/" "$p/"
            elif [ -f "$src/$p" ]; then
              install -D -m 644 "$src/$p" "$p"
            fi
          done

          ignore=""
          for f in .templatesyncignore .github/.templatesyncignore; do
            if [ -f "$f" ]; then ignore="$f"; break; fi
          done
          if [ -n "$ignore" ]; then
            git status --porcelain=v1 -z --untracked-files=all -- "${paths[@]}" \
              | while IFS= read -r -d '' entry; do printf '%s\0' "${entry:3}"; done \
              | git -c core.excludesFile="$ignore" check-ignore --no-index -z --stdin \
              | while IFS= read -r -d '' file; do
                  if git cat-file -e "HEAD:$file" 2>/dev/null; then
                    git checkout HEAD -- "$file"
                  else
                    rm -f "$file"
                  fi
                done
          fi

          {
            echo "add-paths<<EOF"
            printf '%s\n' "${paths[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Abre ou atualiza o PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.token.outputs.value }}
          base: ${{ inputs.destination-branch }}
          branch: chore/template-sync
          delete-branch: true
          add-paths: ${{ steps.copy.outputs.add-paths }}
          commit-message: 'chore(template): sync with template'
          title: 'chore(template): sync with template'
          body: |
            Atualização automática da infraestrutura do template (`${{ inputs.source-repo }}@${{ inputs.source-branch }}`).

            Só entram: `${{ inputs.paths }}`. Exceções do repo ficam no `.templatesyncignore`.
          labels: template-sync

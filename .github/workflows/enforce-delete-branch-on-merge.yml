name: Enforce delete branch on merge

# O GitHub nao tem default de org para "Automatically delete head branches":
# repo novo nasce com delete_branch_on_merge=false. Esta varredura diaria
# religa o flag em todo repo nao arquivado da org, sem tocar em nenhuma
# outra configuracao (o PATCH manda so esse campo).
#
# Token de escrita: App mri-action-runner (Administration write), via
# Infisical (OIDC) + actions/create-github-app-token. Nada de PAT: nenhum
# secrets.GH_TOKEN neste workflow. A chave privada do App vem do Infisical
# (projeto mri-actions-runner-lhv-f, env prod, segredo APP_PRIVATE_KEY
# exportado como env) e o App ID vem de vars.APP_CLIENT_ID (variable do
# repo workflows, nao secret). Permissoes minimas do token: administration
# write + metadata read. Sem continue-on-error nos dois passos: se o
# Infisical ou o token falharem, o job fica VERMELHO (falha visivel, sem
# cair para PAT em silencio). O GITHUB_TOKEN do job fica no minimo
# (contents: read + id-token: write — o id-token e o OIDC que o Infisical
# troca pelos secrets) e serve so para o checkout; a logica usa o GH_TOKEN
# do passo app-token.
#
# Rodar manual com dry-run (so leitura, nenhum PATCH):
#   Actions > Enforce delete branch on merge > Run workflow > dry_run: true

on:
  schedule:
    - cron: '17 6 * * *'  # diario 06:17 UTC, fora do pico
  workflow_dispatch:      # manual; no schedule o dry_run vale false
    inputs:
      dry_run:
        description: 'So listar o que seria ligado, sem PATCH (true/false)'
        type: boolean
        default: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Secrets via Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          domain: https://secrets.mriqbox.com.br
          identity-id: efec2ffe-55d0-479d-9535-8da6b0ea4665
          project-slug: mri-actions-runner-lhv-f
          env-slug: prod
          oidc-audience: https://github.com/mri-Qbox-Brasil

      - name: Token do App mri-action-runner
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: mri-Qbox-Brasil
          permission-administration: write
          permission-metadata: read

      - name: Torna o script executavel
        run: chmod +x .release/enforce-delete-branch.sh

      - name: Varre a org e liga delete_branch_on_merge
        run: ./.release/enforce-delete-branch.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}

name: Callable — Test

# Suíte de testes reutilizável. Dois eixos independentes, porque nem todo repo tem
# os dois: `web-tests` roda o Vitest do pacote da NUI, `lua-tests` roda o harness
# que executa o Lua real do resource sob wasmoon (sem servidor FiveM, sem MySQL).
#
# Sem `continue-on-error` em lugar nenhum: teste que não bloqueia merge é decoração.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
      pnpm-version:
        type: string
        default: '9'

      web-dir:
        description: 'Pacote da NUI'
        type: string
        default: 'web'
      web-tests:
        description: 'Habilita os testes do web (Vitest). Desabilitar em repos Lua-only.'
        type: boolean
        default: true

      lua-tests:
        description: 'Habilita os testes de Lua (harness wasmoon)'
        type: boolean
        default: false
      lua-dir:
        description: 'Pacote onde `pnpm test` roda os testes de Lua'
        type: string
        default: 'tests/lua'
      lua-deps-dirs:
        description: >
          Pacotes locais a instalar ANTES do lua-dir, um por linha. Necessário quando o
          harness é consumido via `link:`: o symlink aponta para um diretório que ainda
          não tem node_modules, então o import não resolve sem instalar nele primeiro.
        type: string
        default: ''

jobs:
  # As chaves `CI_TEST_*` aqui sao TRI-STATE, nao so liga-desliga:
  #
  #   vazia  -> quem decide e o input do wrapper (o default que veio do template)
  #   true   -> liga, mesmo com o input false
  #   false  -> desliga, mesmo com o input true
  #
  # O "true" existe porque o template-sync SOBRESCREVE o wrapper, e o test.yml do
  # template nasce com os dois eixos desligados: o script-template nao tem `tests/`
  # nem script `test` no web/package.json, entao ligar por default quebraria todo
  # repo novo. Cada repo liga o que de fato tem, por var — que sobrevive ao sync.
  # Ver a secao "Chaves liga-desliga" no README.
  test-web:
    name: Test Web (Vitest)
    if: ${{ contains(fromJSON('["true","1","on","yes"]'), vars.CI_TEST_WEB) || (inputs.web-tests && !contains(fromJSON('["false","0","off","no"]'), vars.CI_TEST_WEB)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
          cache-dependency-path: ${{ inputs.web-dir }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ inputs.web-dir }}
        run: pnpm install --no-frozen-lockfile

      - name: Run tests
        working-directory: ${{ inputs.web-dir }}
        run: pnpm test

  test-lua:
    name: Test Lua (harness)
    if: ${{ contains(fromJSON('["true","1","on","yes"]'), vars.CI_TEST_LUA) || (inputs.lua-tests && !contains(fromJSON('["false","0","off","no"]'), vars.CI_TEST_LUA)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
          cache-dependency-path: ${{ inputs.lua-dir }}/pnpm-lock.yaml

      - name: Install local packages
        if: ${{ inputs.lua-deps-dirs != '' }}
        env:
          DEPS_DIRS: ${{ inputs.lua-deps-dirs }}
        run: |
          echo "$DEPS_DIRS" | while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "::group::pnpm install em $dir"
            (cd "$dir" && pnpm install --no-frozen-lockfile)
            echo "::endgroup::"
          done

      - name: Install dependencies
        working-directory: ${{ inputs.lua-dir }}
        run: pnpm install --no-frozen-lockfile

      - name: Run tests
        working-directory: ${{ inputs.lua-dir }}
        run: pnpm test

name: Installer Build (callable)

# Releases the private mri_installer_rust from a public caller repo, where hosted runners are free.
# Without a tag: semantic-release decides the version, builds run first and the version is only cut once they pass.
# With a tag: rebuilds and publishes a version that already exists in the source repo.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Existing source tag to publish, e.g. v2.33.3 (empty releases what is new on main)'
        type: string
        default: ''
      publish:
        description: 'false only builds and checks the binaries'
        type: boolean
        default: true
      source-repo:
        type: string
        default: 'mri-Qbox-Brasil/mri_installer_rust'
      infisical-domain:
        type: string
        default: 'https://secrets.mriqbox.com.br'
      infisical-identity:
        type: string
        default: 'efec2ffe-55d0-479d-9535-8da6b0ea4665'
      infisical-project:
        type: string
        default: 'github-releases-k1-qq'
      infisical-env:
        type: string
        default: 'prod'
      infisical-audience:
        type: string
        default: 'https://github.com/mri-Qbox-Brasil'

permissions:
  contents: read
  id-token: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.meta.outputs.VERSION }}
      PUBLISHED: ${{ steps.meta.outputs.PUBLISHED }}
      SHA: ${{ steps.meta.outputs.SHA }}
      CUT: ${{ steps.meta.outputs.CUT }}
    steps:
      - name: Secrets via Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          domain: ${{ inputs.infisical-domain }}
          identity-id: ${{ inputs.infisical-identity }}
          project-slug: ${{ inputs.infisical-project }}
          env-slug: ${{ inputs.infisical-env }}
          oidc-audience: ${{ inputs.infisical-audience }}

      # Write access because the semantic-release dry run checks it can push.
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liV92Fq3ELbFjA4g
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: mri-Qbox-Brasil
          repositories: mri_installer_rust
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source-repo }}
          ref: ${{ inputs.tag || 'main' }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7
        if: inputs.tag == ''
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: inputs.tag == ''

      - name: Next version
        id: meta
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "PUBLISHED=true" >> "$GITHUB_OUTPUT"
            echo "CUT=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx semantic-release --dry-run 2>&1 | tee sr-dry.log
          VERSION=$(grep -oiE 'the next release version is [0-9]+\.[0-9]+\.[0-9]+' sr-dry.log | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -n1 || true)
          if [ -n "$VERSION" ]; then
            echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
            echo "PUBLISHED=true" >> "$GITHUB_OUTPUT"
            echo "CUT=true" >> "$GITHUB_OUTPUT"
            echo "next version: $VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "PUBLISHED=false" >> "$GITHUB_OUTPUT"
            echo "nothing to release" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  windows:
    name: Build (Windows, GUI)
    needs: version
    if: needs.version.outputs.PUBLISHED == 'true'
    runs-on: windows-latest
    steps:
      - name: Secrets via Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          domain: ${{ inputs.infisical-domain }}
          identity-id: ${{ inputs.infisical-identity }}
          project-slug: ${{ inputs.infisical-project }}
          env-slug: ${{ inputs.infisical-env }}
          oidc-audience: ${{ inputs.infisical-audience }}

      - name: App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liV92Fq3ELbFjA4g
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: mri-Qbox-Brasil
          repositories: mri_installer_rust
          permission-contents: read

      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source-repo }}
          ref: ${{ needs.version.outputs.SHA }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: gui

      - run: npm ci

      - name: Apply version
        run: node scripts/aplicar-versao.cjs "${{ needs.version.outputs.VERSION }}"

      - name: Tests
        working-directory: src-tauri
        run: cargo test --release --lib

      - name: Build (GUI app)
        run: npm run tauri build

      # A packaging mix-up once shipped the CLI under the GUI name, so check size and WebView2.
      - name: Check the GUI binary
        shell: bash
        run: |
          set -euo pipefail
          EXE="src-tauri/target/release/mri_installer.exe"
          TAM=$(stat -c%s "$EXE")
          [ "$TAM" -ge 20000000 ] || { echo "::error::$EXE has $TAM bytes, too small for the GUI app"; exit 1; }
          grep -qa "WebView2" "$EXE" || { echo "::error::$EXE does not mention WebView2"; exit 1; }
          mkdir -p entrega && cp "$EXE" entrega/ && ls -l entrega

      - uses: actions/cache/save@v4
        with:
          key: installer-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: entrega/
          enableCrossOsArchive: true

  windows_cli:
    name: Build (Windows, CLI)
    needs: version
    if: needs.version.outputs.PUBLISHED == 'true'
    runs-on: windows-latest
    steps:
      - name: Secrets via Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          domain: ${{ inputs.infisical-domain }}
          identity-id: ${{ inputs.infisical-identity }}
          project-slug: ${{ inputs.infisical-project }}
          env-slug: ${{ inputs.infisical-env }}
          oidc-audience: ${{ inputs.infisical-audience }}

      - name: App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liV92Fq3ELbFjA4g
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: mri-Qbox-Brasil
          repositories: mri_installer_rust
          permission-contents: read

      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source-repo }}
          ref: ${{ needs.version.outputs.SHA }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: cli-windows

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Apply version
        run: node scripts/aplicar-versao.cjs "${{ needs.version.outputs.VERSION }}"

      # The CLI embeds dist/ for its web panel (--web); without it the panel has no UI.
      - name: Frontend (web panel)
        run: |
          npm ci
          npm run build

      - name: Build (CLI)
        working-directory: src-tauri
        run: cargo build --release --no-default-features --features headless --bin mri_installer_headless

      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p entrega
          cp src-tauri/target/release/mri_installer_headless.exe entrega/
          ls -l entrega

      - uses: actions/cache/save@v4
        with:
          key: installer-windows-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: entrega/
          enableCrossOsArchive: true

  linux:
    name: Build (Linux)
    needs: version
    if: needs.version.outputs.PUBLISHED == 'true'
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins the MSVC toolchain, which doesn't exist here.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Secrets via Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          domain: ${{ inputs.infisical-domain }}
          identity-id: ${{ inputs.infisical-identity }}
          project-slug: ${{ inputs.infisical-project }}
          env-slug: ${{ inputs.infisical-env }}
          oidc-audience: ${{ inputs.infisical-audience }}

      - name: App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liV92Fq3ELbFjA4g
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: mri-Qbox-Brasil
          repositories: mri_installer_rust
          permission-contents: read

      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source-repo }}
          ref: ${{ needs.version.outputs.SHA }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: cli-linux

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Apply version
        run: node scripts/aplicar-versao.cjs "${{ needs.version.outputs.VERSION }}"

      # The CLI embeds dist/ for its web panel (--web); without it the panel has no UI.
      - name: Frontend (web panel)
        run: |
          npm ci
          npm run build

      - name: Tests
        working-directory: src-tauri
        run: cargo test --release --lib --no-default-features --features headless

      - name: Build (CLI)
        working-directory: src-tauri
        run: cargo build --release --no-default-features --features headless --bin mri_installer_headless

      - name: Check it has no GUI dependency
        run: |
          set -euo pipefail
          BIN=src-tauri/target/release/mri_installer_headless
          if ldd "$BIN" | grep -qi 'webkit\|gtk\|javascriptcore'; then
            echo "::error::$BIN links a GUI library and won't run on a server"
            exit 1
          fi
          mkdir -p entrega
          cp "$BIN" entrega/mri_installer_linux
          chmod +x entrega/mri_installer_linux
          ls -l entrega

      - uses: actions/cache/save@v4
        with:
          key: installer-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: entrega/
          enableCrossOsArchive: true

  publish:
    name: Publish
    needs: [version, windows, windows_cli, linux]
    if: needs.version.outputs.PUBLISHED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          key: installer-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: entrega/
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v4
        with:
          key: installer-windows-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: entrega/
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v4
        with:
          key: installer-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: entrega/
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Binaries
        run: |
          set -euo pipefail
          for f in mri_installer.exe mri_installer_headless.exe mri_installer_linux; do
            [ -s "entrega/$f" ] || { echo "::error::missing entrega/$f"; exit 1; }
          done
          ls -l entrega
          sha256sum entrega/* | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Secrets via Infisical (OIDC)
        if: inputs.publish
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          domain: ${{ inputs.infisical-domain }}
          identity-id: ${{ inputs.infisical-identity }}
          project-slug: ${{ inputs.infisical-project }}
          env-slug: ${{ inputs.infisical-env }}
          oidc-audience: ${{ inputs.infisical-audience }}

      - name: App token
        id: app-token
        if: inputs.publish
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liV92Fq3ELbFjA4g
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: mri-Qbox-Brasil
          repositories: mri_installer_rust,${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # Must sit on the tip of main to push the version commit; if main moved since the builds, it refuses.
      - uses: actions/checkout@v7
        if: inputs.publish && needs.version.outputs.CUT == 'true'
        with:
          repository: ${{ inputs.source-repo }}
          ref: main
          fetch-depth: 0
          path: source
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7
        if: inputs.publish && needs.version.outputs.CUT == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Semantic Release
        if: inputs.publish && needs.version.outputs.CUT == 'true'
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "${{ needs.version.outputs.SHA }}" ] || { echo "::error::main moved since the builds, nothing released; run again"; exit 1; }
          npm ci
          npx semantic-release
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null || { echo "::error::semantic-release did not create v$VERSION"; exit 1; }

      - name: Release in the download repo
        if: inputs.publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: v${{ needs.version.outputs.VERSION }}
          SOURCE: ${{ inputs.source-repo }}
          TARGET: ${{ github.repository }}
        run: |
          set -euo pipefail
          # .NOTES.md (written by semantic-release) carries the highlights section; the source release body doesn't.
          if [ -s source/.NOTES.md ]; then cp source/.NOTES.md notes.md; else gh release view "$TAG" -R "$SOURCE" --json body -q .body > notes.md; fi
          gh release create "$TAG" -R "$TARGET" --title "$TAG" --notes-file notes.md --latest entrega/*
          gh release upload "$TAG" -R "$SOURCE" entrega/* --clobber

      # After the release on purpose: a failed README push must not undo a published version.
      - name: Sync README
        if: inputs.publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: v${{ needs.version.outputs.VERSION }}
          SOURCE: ${{ inputs.source-repo }}
          TARGET: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${TARGET}.git" public_repo
          for l in "" .en .es; do
            gh api "repos/${SOURCE}/contents/README_PUBLIC${l}.md?ref=${TAG}" -H "Accept: application/vnd.github.raw" > "public_repo/README${l}.md"
          done
          cd public_repo
          if git diff --quiet; then echo "README unchanged"; exit 0; fi
          git add README.md README.en.md README.es.md
          git commit -m "docs: update README from source ${TAG} [skip ci]"
          git push origin HEAD
